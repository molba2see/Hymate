<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#9AA2AE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#00B868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#FBFCFD" rx="16"/>

  <text x="48" y="50" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3" font-weight="700" fill="#0F8A52">&#9670; SYSTEM / HOW IT WORKS</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#131417">시스템 구성</text>

  <!-- INPUT -->
  <text x="48" y="126" font-family="Consolas,Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#8A90A0">INPUT — 차량 신호 (수신 전용)</text>
  <line x1="48" y1="136" x2="348" y2="136" stroke="#E4E7EC" stroke-width="1.5"/>
  <g>
    <rect x="48" y="152" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="48" y="152" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="68" y="177" font-size="15" font-weight="700" fill="#131417">Vehicle SDK</text>
    <text x="68" y="198" font-size="12.5" fill="#667085">지시등 · 전조등 · 와이퍼 · 기어 · 크루즈</text>

    <rect x="48" y="224" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="48" y="224" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="68" y="249" font-size="15" font-weight="700" fill="#131417">AAOS 차속</text>
    <text x="68" y="270" font-size="12.5" fill="#667085">PERF_VEHICLE_SPEED</text>

    <rect x="48" y="296" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="48" y="296" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="68" y="321" font-size="15" font-weight="700" fill="#131417">FusedLocation</text>
    <text x="68" y="342" font-size="12.5" fill="#667085">위경도 — 경로 투영 · 재탐색</text>

    <rect x="48" y="368" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="48" y="368" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="68" y="393" font-size="15" font-weight="700" fill="#131417">CarUxRestrictions</text>
    <text x="68" y="414" font-size="12.5" fill="#667085">주행 중 화면 잠금</text>

    <rect x="48" y="440" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="48" y="440" width="4" height="58" rx="2" fill="#6A57FF"/>
    <text x="68" y="465" font-size="15" font-weight="700" fill="#131417">Speech Service</text>
    <text x="68" y="486" font-size="12.5" fill="#667085">차량 TTS · STT — 정차 중에만</text>
  </g>

  <!-- CORE -->
  <text x="450" y="126" font-family="Consolas,Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#8A90A0">CORE — 온디바이스 처리</text>
  <line x1="450" y1="136" x2="750" y2="136" stroke="#E4E7EC" stroke-width="1.5"/>
  <g>
    <rect x="450" y="152" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="450" y="152" width="4" height="58" rx="2" fill="#0066FF"/>
    <text x="470" y="177" font-size="15" font-weight="700" fill="#131417">OSRM 길찾기</text>
    <text x="470" y="198" font-size="12.5" fill="#667085">실도로 경로 — 회전·합류가 판정 지점</text>

    <rect x="450" y="238" width="300" height="72" rx="10" fill="#FFFFFF" stroke="#00B868" stroke-width="1.5"/>
    <rect x="450" y="238" width="4" height="72" rx="2" fill="#00C86E"/>
    <text x="470" y="265" font-size="15" font-weight="700" fill="#131417">HyViewModel</text>
    <text x="470" y="286" font-size="12.5" fill="#667085">상태 허브 — 모든 신호를 메인 스레드로</text>
    <text x="470" y="303" font-size="12.5" fill="#667085">정차 판정 0.5km/h · 브레이크 3초</text>

    <rect x="450" y="338" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="450" y="338" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="470" y="363" font-size="15" font-weight="700" fill="#131417">LiveQuestEvaluator</text>
    <text x="470" y="384" font-size="12.5" fill="#667085">지점 통과 시 실제 신호로만 판정</text>

    <rect x="450" y="424" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="450" y="424" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="470" y="449" font-size="15" font-weight="700" fill="#131417">computeGrowth</text>
    <text x="470" y="470" font-size="12.5" fill="#667085">XP · 졸업 · 복귀 — 순수 함수</text>
  </g>
  <line x1="600" y1="210" x2="600" y2="232" stroke="#00B868" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="600" y1="310" x2="600" y2="332" stroke="#00B868" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="600" y1="396" x2="600" y2="418" stroke="#00B868" stroke-width="2" marker-end="url(#ag)"/>

  <!-- OUTPUT -->
  <text x="852" y="126" font-family="Consolas,Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#8A90A0">OUTPUT — 피드백과 성장</text>
  <line x1="852" y1="136" x2="1152" y2="136" stroke="#E4E7EC" stroke-width="1.5"/>
  <g>
    <rect x="852" y="152" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="852" y="152" width="4" height="58" rx="2" fill="#0066FF"/>
    <text x="872" y="177" font-size="15" font-weight="700" fill="#131417">주행 중 — 표시만</text>
    <text x="872" y="198" font-size="12.5" fill="#667085">실지도 · 회전 안내 · ETA · 상태 알약</text>

    <rect x="852" y="238" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="852" y="238" width="4" height="58" rx="2" fill="#6A57FF"/>
    <text x="872" y="263" font-size="15" font-weight="700" fill="#131417">정차 중 — 음성 한 마디</text>
    <text x="872" y="284" font-size="12.5" fill="#667085">놓친 가이드 1개 · 재출발 시 중단</text>

    <rect x="852" y="324" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="852" y="324" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="872" y="349" font-size="15" font-weight="700" fill="#131417">주차 후 — 리포트</text>
    <text x="872" y="370" font-size="12.5" fill="#667085">자동 판정 · 자가 체크 · 이의 제기</text>

    <rect x="852" y="410" width="300" height="58" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <rect x="852" y="410" width="4" height="58" rx="2" fill="#00C86E"/>
    <text x="872" y="435" font-size="15" font-weight="700" fill="#131417">성장</text>
    <text x="872" y="456" font-size="12.5" fill="#667085">XP · 졸업 · 라이선스 승급</text>
  </g>

  <!-- 컬럼 연결 -->
  <line x1="356" y1="318" x2="442" y2="318" stroke="#9AA2AE" stroke-width="2" marker-end="url(#ah)"/>
  <text x="399" y="306" text-anchor="middle" font-size="12" fill="#8A90A0">콜백</text>
  <line x1="758" y1="318" x2="844" y2="318" stroke="#9AA2AE" stroke-width="2" marker-end="url(#ah)"/>
  <text x="801" y="306" text-anchor="middle" font-size="12" fill="#8A90A0">결과</text>

  <line x1="48" y1="540" x2="1152" y2="540" stroke="#E4E7EC" stroke-width="1.5"/>
  <text x="600" y="570" text-anchor="middle" font-size="13.5" fill="#8A90A0">차량 신호는 수신 전용 · 판정은 전부 온디바이스 · 네트워크는 지도 타일과 길찾기에만 사용</text>
</svg>
