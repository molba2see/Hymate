<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F626B"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0066FF"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#F7F8FA" rx="18"/>
  <text x="48" y="54" font-size="26" font-weight="800" fill="#131417">시스템 구성</text>
  <text x="48" y="82" font-size="16" fill="#5F626B">차량 신호는 전부 수신 전용 · 판정은 온디바이스 · 네트워크는 지도와 길찾기에만 사용</text>

  <!-- 차량 그룹 -->
  <rect x="48" y="110" width="300" height="462" rx="16" fill="#FFFFFF" stroke="#E0E1E6"/>
  <text x="72" y="148" font-size="18" font-weight="700" fill="#131417">차량 · Pleos Connect</text>
  <g font-size="15">
    <rect x="72" y="168" width="252" height="66" rx="10" fill="#F1F3F6"/>
    <text x="86" y="195" font-weight="700" fill="#131417">Vehicle SDK</text>
    <text x="86" y="218" font-size="13" fill="#5F626B">지시등 · 전조등 · 와이퍼 · 기어 · 크루즈</text>
    <rect x="72" y="246" width="252" height="54" rx="10" fill="#F1F3F6"/>
    <text x="86" y="273" font-weight="700" fill="#131417">AAOS 차속</text>
    <text x="86" y="292" fill="#5F626B">PERF_VEHICLE_SPEED</text>
    <rect x="72" y="312" width="252" height="54" rx="10" fill="#F1F3F6"/>
    <text x="86" y="339" font-weight="700" fill="#131417">FusedLocation</text>
    <text x="86" y="358" fill="#5F626B">차량 위경도</text>
    <rect x="72" y="378" width="252" height="54" rx="10" fill="#F1F3F6"/>
    <text x="86" y="405" font-weight="700" fill="#131417">CarUxRestrictions</text>
    <text x="86" y="424" fill="#5F626B">주행 중 화면 잠금</text>
    <rect x="72" y="444" width="252" height="54" rx="10" fill="#EDE9FF"/>
    <text x="86" y="471" font-weight="700" fill="#131417">Speech Service</text>
    <text x="86" y="490" fill="#5F626B">차량 TTS · STT</text>
  </g>

  <!-- 중앙 허브 -->
  <rect x="452" y="226" width="256" height="170" rx="16" fill="#0F8A52" opacity="0.06"/>
  <rect x="452" y="226" width="256" height="170" rx="16" fill="none" stroke="#00B868" stroke-width="2"/>
  <text x="580" y="276" text-anchor="middle" font-size="20" font-weight="800" fill="#131417">HyViewModel</text>
  <text x="580" y="304" text-anchor="middle" font-size="15" fill="#5F626B">화면 상태 · 주행 세션 허브</text>
  <text x="580" y="330" text-anchor="middle" font-size="15" fill="#5F626B">모든 신호를 메인 스레드로 수신</text>
  <text x="580" y="356" text-anchor="middle" font-size="15" fill="#5F626B">정차 중에만 음성 한 마디</text>

  <!-- 네트워크 -->
  <rect x="452" y="110" width="256" height="84" rx="14" fill="#FFFFFF" stroke="#E0E1E6"/>
  <text x="580" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#131417">OSRM 길찾기 · OSM 지도</text>
  <text x="580" y="168" text-anchor="middle" font-size="14" fill="#5F626B">실도로 경로 → 회전·합류 = 판정 지점</text>

  <!-- 우측 파이프라인 -->
  <rect x="824" y="110" width="328" height="462" rx="16" fill="#FFFFFF" stroke="#E0E1E6"/>
  <text x="848" y="148" font-size="18" font-weight="700" fill="#131417">판정 → 성장 파이프라인</text>
  <g font-size="15">
    <rect x="848" y="170" width="280" height="76" rx="10" fill="#EAF3FF"/>
    <text x="862" y="198" font-weight="700" fill="#131417">LiveQuestEvaluator</text>
    <text x="862" y="220" fill="#5F626B">실제 신호로 성공·놓침 판정</text>
    <text x="862" y="238" fill="#5F626B">미수신 신호는 자가 체크로 전환</text>
    <rect x="848" y="262" width="280" height="76" rx="10" fill="#EAF3FF"/>
    <text x="862" y="290" font-weight="700" fill="#131417">주행 리포트</text>
    <text x="862" y="312" fill="#5F626B">자동 판정 · 자가 체크 · 이의 제기</text>
    <text x="862" y="330" fill="#5F626B">놓친 지점은 지도에 표시</text>
    <rect x="848" y="354" width="280" height="76" rx="10" fill="#E6FAF0"/>
    <text x="862" y="382" font-weight="700" fill="#131417">computeGrowth</text>
    <text x="862" y="404" fill="#5F626B">XP · 졸업(1회 / 3지점) · 복귀 규칙</text>
    <text x="862" y="422" fill="#5F626B">순수 함수 — 단위 테스트로 검증</text>
    <rect x="848" y="446" width="280" height="76" rx="10" fill="#E6FAF0"/>
    <text x="862" y="474" font-weight="700" fill="#131417">라이선스</text>
    <text x="862" y="496" fill="#5F626B">누적 XP로 L0 → L1 → … 승급</text>
    <text x="862" y="514" fill="#5F626B">주차 중에만 열람</text>
  </g>

  <!-- 화살표: 차량 → 허브 -->
  <line x1="348" y1="201" x2="444" y2="268" stroke="#5F626B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="348" y1="273" x2="444" y2="295" stroke="#5F626B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="348" y1="339" x2="444" y2="322" stroke="#5F626B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="348" y1="405" x2="444" y2="352" stroke="#5F626B" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Speech 양방향 -->
  <line x1="348" y1="471" x2="446" y2="382" stroke="#6A57FF" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <!-- 네트워크 ↕ 허브 -->
  <line x1="580" y1="194" x2="580" y2="218" stroke="#0066FF" stroke-width="2" marker-end="url(#arrowB)" marker-start="url(#arrowB)"/>
  <!-- 허브 → 파이프라인 -->
  <line x1="708" y1="311" x2="816" y2="311" stroke="#5F626B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="762" y="300" text-anchor="middle" font-size="13" fill="#5F626B">관측값</text>
</svg>
