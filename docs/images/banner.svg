<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171C"/>
      <stop offset="1" stop-color="#1E2128"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E074"/>
      <stop offset="0.55" stop-color="#0082FF"/>
      <stop offset="1" stop-color="#6A57FF"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E074" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E074"/>
      <stop offset="1" stop-color="#0082FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <!-- 도로 라인 장식 -->
  <rect x="0" y="196" width="1200" height="3" fill="url(#road)" opacity="0.8"/>
  <g opacity="0.55">
    <rect x="120" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="240" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="360" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="480" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="600" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="720" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="840" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="960" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
    <rect x="1080" y="207" width="56" height="4" rx="2" fill="#3A3F4B"/>
  </g>
  <!-- 브랜드 마크 -->
  <circle cx="150" cy="104" r="54" fill="url(#mark)"/>
  <text x="150" y="122" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">Hy</text>
  <!-- 워드마크 -->
  <text x="240" y="96" font-size="54" font-weight="800" fill="#FFFFFF">Hy! mate</text>
  <text x="243" y="140" font-size="24" fill="#A3A6AE">초보운전 동승 코치 · Pleos Connect 차량 앱</text>
  <!-- 우측 라이선스 칩 -->
  <g>
    <rect x="952" y="66" width="188" height="76" rx="16" fill="#23262D" stroke="#3A3F4B"/>
    <text x="978" y="98" font-size="17" fill="#8A90A0">DRIVING LICENSE</text>
    <text x="978" y="128" font-size="26" font-weight="700" fill="#00E074">L0 → L1 → P1</text>
  </g>
  <rect x="860" y="66" width="76" height="76" rx="16" fill="#23262D" stroke="#3A3F4B"/>
  <text x="898" y="104" text-anchor="middle" font-size="15" fill="#8A90A0">Pleos</text>
  <text x="898" y="124" text-anchor="middle" font-size="15" fill="#8A90A0">Connect</text>
</svg>
