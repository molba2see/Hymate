<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#9AA2AE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" fill="#FBFCFD" rx="16"/>

  <text x="48" y="50" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3" font-weight="700" fill="#0F8A52">&#9670; FLOW / ONE DRIVE</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#131417">한 번의 주행</text>

  <!-- 타임라인 -->
  <line x1="130" y1="168" x2="1030" y2="168" stroke="#E4E7EC" stroke-width="3"/>
  <line x1="130" y1="168" x2="580" y2="168" stroke="#00C86E" stroke-width="3"/>

  <!-- 1 -->
  <text x="130" y="134" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A90A0">주차 중</text>
  <circle cx="130" cy="168" r="19" fill="#FFFFFF" stroke="#00B868" stroke-width="2.5"/>
  <text x="130" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#0F8A52">1</text>
  <text x="130" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#131417">출발 전 학습</text>
  <text x="130" y="238" text-anchor="middle" font-size="12.5" fill="#667085">가이드 확인 · 레버 실습</text>
  <text x="130" y="256" text-anchor="middle" font-size="12.5" fill="#667085">동의 선택</text>

  <!-- 2 -->
  <text x="355" y="134" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A90A0">출발</text>
  <circle cx="355" cy="168" r="19" fill="#FFFFFF" stroke="#00B868" stroke-width="2.5"/>
  <text x="355" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#0F8A52">2</text>
  <text x="355" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#131417">경로 탐색</text>
  <text x="355" y="238" text-anchor="middle" font-size="12.5" fill="#667085">실도로 길찾기</text>
  <text x="355" y="256" text-anchor="middle" font-size="12.5" fill="#667085">회전·합류가 판정 지점</text>

  <!-- 3 (강조) -->
  <text x="580" y="134" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#0F8A52">주행 중</text>
  <circle cx="580" cy="168" r="21" fill="#00B868"/>
  <text x="580" y="175" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
  <text x="580" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#131417">비간섭 관찰</text>
  <text x="580" y="238" text-anchor="middle" font-size="12.5" fill="#667085">화면 조작 없음</text>
  <text x="580" y="256" text-anchor="middle" font-size="12.5" fill="#667085">차량 신호만 기록</text>

  <!-- 4 -->
  <text x="805" y="134" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A90A0">정차</text>
  <circle cx="805" cy="168" r="19" fill="#FFFFFF" stroke="#6A57FF" stroke-width="2.5"/>
  <text x="805" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#6A57FF">4</text>
  <text x="805" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#131417">음성 한 마디</text>
  <text x="805" y="238" text-anchor="middle" font-size="12.5" fill="#667085">놓친 가이드 1개만</text>
  <text x="805" y="256" text-anchor="middle" font-size="12.5" fill="#667085">재출발 시 즉시 중단</text>

  <!-- 5 -->
  <text x="1030" y="134" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A90A0">주차 후</text>
  <circle cx="1030" cy="168" r="19" fill="#FFFFFF" stroke="#00B868" stroke-width="2.5"/>
  <text x="1030" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#0F8A52">5</text>
  <text x="1030" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#131417">리포트 · 성장</text>
  <text x="1030" y="238" text-anchor="middle" font-size="12.5" fill="#667085">자가 체크 · 이의 제기</text>
  <text x="1030" y="256" text-anchor="middle" font-size="12.5" fill="#667085">XP · 라이선스</text>

  <!-- 3↔4 반복 -->
  <path d="M 805 276 L 805 292 L 580 292 L 580 280" fill="none" stroke="#C6CCD4" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#fl)"/>
  <text x="693" y="310" text-anchor="middle" font-size="12.5" fill="#8A90A0">도착할 때까지 반복</text>
</svg>
