<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#0F8A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FBFCFD" rx="16"/>

  <text x="48" y="50" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3" font-weight="700" fill="#0F8A52">&#9670; PROBLEM / WHY HY! MATE</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#131417">혼자 타는 순간, 동승자가 사라진다</text>

  <!-- 장면 A: 동승자가 있을 때 -->
  <rect x="48" y="112" width="540" height="158" rx="12" fill="#FFFFFF" stroke="#E4E7EC"/>
  <rect x="48" y="112" width="4" height="158" rx="2" fill="#00C86E"/>
  <text x="76" y="142" font-size="15" font-weight="700" fill="#131417">동승자가 있을 때</text>
  <!-- 두 사람 -->
  <g fill="#C9CFD8">
    <circle cx="104" cy="186" r="13"/>
    <path d="M84 232 a20 20 0 0 1 40 0 z"/>
    <circle cx="152" cy="186" r="13" fill="#00C86E"/>
    <path d="M132 232 a20 20 0 0 1 40 0 z" fill="#00C86E"/>
  </g>
  <!-- 말풍선 -->
  <rect x="206" y="162" width="340" height="40" rx="12" fill="#E6FAF0"/>
  <path d="M206 186 L190 196 L206 198 z" fill="#E6FAF0"/>
  <text x="226" y="188" font-size="13.5" fill="#0B6B40">"이따 우회전이야, 깜빡이 미리 켜자"</text>
  <rect x="206" y="210" width="230" height="36" rx="12" fill="#E6FAF0"/>
  <text x="226" y="234" font-size="13.5" fill="#0B6B40">"방금 차선 변경 좋았어"</text>
  <text x="76" y="260" font-size="12.5" fill="#667085">조언이 두려움을 덜고 · 격려가 자신감이 된다</text>

  <!-- 장면 B: 혼자 탈 때 -->
  <rect x="612" y="112" width="540" height="158" rx="12" fill="#FFFFFF" stroke="#E4E7EC"/>
  <rect x="612" y="112" width="4" height="158" rx="2" fill="#D1D5DC"/>
  <text x="640" y="142" font-size="15" font-weight="700" fill="#131417">혼자 탈 때</text>
  <g fill="#C9CFD8">
    <circle cx="668" cy="186" r="13"/>
    <path d="M648 232 a20 20 0 0 1 40 0 z"/>
  </g>
  <!-- 빈 옆자리 -->
  <rect x="706" y="176" width="52" height="56" rx="10" fill="none" stroke="#D1D5DC" stroke-dasharray="5 4"/>
  <rect x="770" y="162" width="120" height="40" rx="12" fill="none" stroke="#D1D5DC" stroke-dasharray="5 4"/>
  <text x="830" y="188" text-anchor="middle" font-size="15" fill="#9AA2AE">· · ·</text>
  <text x="640" y="238" font-size="12.5" fill="#667085">조언도 격려도 없이 낯선 도로를 혼자 마주한다</text>
  <text x="640" y="260" font-size="12.5" fill="#667085">초행길과 고속도로를 피하고 · 이동 자체를 망설인다</text>

  <!-- 악순환 -->
  <text x="48" y="308" font-family="Consolas,Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#B45309">그리고, 악순환</text>
  <g>
    <rect x="48" y="320" width="255" height="74" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="70" y="350" font-size="15" font-weight="700" fill="#131417">운전이 두렵다</text>
    <text x="70" y="374" font-size="12.5" fill="#667085">혼자일 때는 더</text>

    <rect x="325" y="320" width="255" height="74" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="347" y="350" font-size="15" font-weight="700" fill="#131417">운전을 피한다</text>
    <text x="347" y="374" font-size="12.5" fill="#667085">초행길 · 고속도로 · 약속</text>

    <rect x="602" y="320" width="255" height="74" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="624" y="350" font-size="15" font-weight="700" fill="#131417">경험이 쌓이지 않는다</text>
    <text x="624" y="374" font-size="12.5" fill="#667085">잘한 점도 실수도 모른 채</text>

    <rect x="879" y="320" width="255" height="74" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="901" y="350" font-size="15" font-weight="700" fill="#131417">같은 실수를 반복한다</text>
    <text x="901" y="374" font-size="12.5" fill="#667085">자신감은 더 줄어든다</text>
  </g>
  <line x1="303" y1="357" x2="321" y2="357" stroke="#B45309" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="580" y1="357" x2="598" y2="357" stroke="#B45309" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="857" y1="357" x2="875" y2="357" stroke="#B45309" stroke-width="2" marker-end="url(#pa)"/>
  <path d="M 1006 394 L 1006 414 L 176 414 L 176 398" fill="none" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#pa)" opacity="0.7"/>
  <text x="591" y="432" text-anchor="middle" font-size="12.5" fill="#B45309">다시 두려움으로</text>

  <!-- 기존 한계 → 해결 -->
  <rect x="48" y="456" width="1104" height="76" rx="12" fill="#F1F3F6"/>
  <text x="76" y="488" font-size="14" fill="#475467">기존 운전점수 앱은 스마트폰 GPS뿐 — 방향지시등 · 와이퍼 · 브레이크 같은 실제 조작은 보지 못한다</text>
  <line x1="76" y1="502" x2="104" y2="502" stroke="#0F8A52" stroke-width="2" marker-end="url(#pg)"/>
  <text x="116" y="508" font-size="14.5" font-weight="700" fill="#0F8A52">Hy! mate는 차량 데이터로 실제 조작을 직접 확인하고, 동승자의 조언과 격려를 대신한다</text>
</svg>
